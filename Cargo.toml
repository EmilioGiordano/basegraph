[package]
name = "codegraph"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
syn = { version = "2.0", features = ["full", "extra-traits", "parsing", "visit"] }
proc-macro2 = { version = "1.0", features = ["span-locations"] }
quote = "1.0"
anyhow = "1.0"
clap = { version = "4.0", features = ["derive"] }

[lib]
path = "src/lib.rs"

[[bin]]
name = "codegraph"
path = "src/main.rs"

# Experiment harness for the go/no-go protocol (go-no-go.md). Separate binaries
# so the product crate stays free of experiment logic; they share only the
# schema in tools/common.
[[bin]]
name = "synth_repo_gen"
path = "tools/synth_repo_gen/main.rs"

[[bin]]
name = "experiment_runner"
path = "tools/experiment_runner/main.rs"

[[bin]]
name = "scorer"
path = "tools/scorer/main.rs"
