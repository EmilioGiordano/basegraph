[package]
name = "codegraph"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
syn = { version = "2.0", features = ["full", "extra-traits", "parsing"] }
proc-macro2 = { version = "1.0", features = ["span-locations"] }
quote = "1.0"
anyhow = "1.0"
clap = { version = "4.0", features = ["derive"] }

[lib]
path = "src/lib.rs"

[[bin]]
name = "codegraph"
path = "src/main.rs"
